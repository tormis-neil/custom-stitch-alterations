<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Request received | CustomStitchStudio LLC</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;600;700&family=Yellowtail&display=swap">
<style>
  :root{
    --ground:#FAF7F5; --surface:#FFFFFF; --ink:#2A1B33; --ink-soft:#5C4A66;
    --line:#E4DAD9; --violet:#8B26CD; --plum:#5B1A86; --dusty:#A4B7C9;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Karla","Helvetica Neue",Arial,sans-serif;
    --script:"Yellowtail","Brush Script MT",cursive;
    --gradient:linear-gradient(95deg,#C74B88 0%,#B03DA2 45%,#8B26CD 100%);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
    font-family:var(--sans);font-size:17px;line-height:1.65;
    display:grid;place-items:center;padding:40px 24px;
  }
  .card{
    max-width:540px;width:100%;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:48px 44px;text-align:center;
    box-shadow:0 2px 4px rgba(42,27,51,.06), 0 20px 44px -24px rgba(42,27,51,.3);
  }
  .logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:34px}
  .logo svg{width:24px;height:35px}
  .logo .word{
    font-family:var(--script);font-size:24px;line-height:1;padding-top:5px;
    background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tick{
    width:66px;height:66px;margin:0 auto 26px;border-radius:50%;
    background:var(--violet);display:grid;place-items:center;
  }
  .tick svg{width:32px;height:32px;color:#fff}
  h1{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.15;margin:0 0 14px}
  p{color:var(--ink-soft);margin:0 0 12px}
  p.small{font-size:14.5px;color:#8A7B92;margin-top:26px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .btn{
    font-family:var(--sans);font-size:16px;font-weight:700;padding:14px 26px;border-radius:6px;
    text-decoration:none;display:inline-block;border:2px solid transparent;
  }
  .btn-primary{background:var(--violet);color:#fff;box-shadow:0 3px 0 var(--plum)}
  .btn-primary:hover{background:var(--plum)}
  .btn-ghost{color:var(--plum);border-color:var(--dusty)}
  .btn-ghost:hover{border-color:var(--violet);color:var(--violet)}
  .btn:focus-visible{outline:3px solid #5F7FAD;outline-offset:3px}
  @media (max-width:520px){ .card{padding:36px 26px} h1{font-size:32px} }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg viewBox="0 0 30 44" fill="none" aria-hidden="true">
        <ellipse cx="15" cy="5.5" rx="9" ry="2.6" fill="#A4B7C9"/>
        <circle cx="15" cy="7.5" r="2.6" fill="#A4B7C9"/>
        <path d="M15 10c-2.6 0-4.2 1.7-4.2 4.2 0 2 .5 3.4.5 5.2 0 3.4-3.6 8.6-6.3 14.2-1.2 2.5-1 4.4 1 5.6 2.4 1.4 6 2 9 2s6.6-.6 9-2c2-1.2 2.2-3.1 1-5.6-2.7-5.6-6.3-10.8-6.3-14.2 0-1.8.5-3.2.5-5.2 0-2.5-1.6-4.2-4.2-4.2z" fill="#A4B7C9"/>
      </svg>
      <span class="word">CustomStitchStudio</span>
    </div>

    <div class="tick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>

    <h1>Your request is in</h1>
    <p>She reads every message herself and usually replies the same day.</p>
    <p>If your event is soon and you would rather not wait, call the studio directly.</p>

    <div class="actions">
      <a class="btn btn-primary" href="tel:+19037440671">Call (903) 744-0671</a>
      <a class="btn btn-ghost" href="/">Back to the site</a>
    </div>

    <p class="small">4411 Old Bullard Rd, Suite 703 &middot; Tyler, Texas 75703</p>
  </main>
</body>
</html>
